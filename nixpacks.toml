[phases.setup]
nixPkgs = ['nodejs_20', 'pnpm']

[phases.install]
cmds = ['pnpm install --filter backend --filter @shared/db --filter @shared/types --frozen-lockfile']
cacheDirectories = ['/root/.local/share/pnpm/store']

[phases.build]
cmds = [
  'pnpm --filter @shared/db db:generate',
  'pnpm --filter backend build'
]

[start]
cmd = "pnpm --filter @shared/db db:deploy && node backend/dist/server.mjs"

[variables]
HUSKY = '0'
CI = 'true'

